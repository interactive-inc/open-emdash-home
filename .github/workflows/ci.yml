name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce # v1.22.0
        with:
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run test
      - run: vp run build
      - run: vp run build:cloudflare
      - run: vp run test:package
